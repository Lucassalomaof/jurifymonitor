<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jurify Monitor · Toga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&family=Ubuntu+Mono:wght@400;700&display=swap">
<style>
/* Layout: app shell — sidebar fixa + área de trabalho com header de vidro; sheets laterais para detalhe; jobs assíncronos globais */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EDEFF3; --surface-3:#E2E6EC; --line:#E0E4EA; --line-2:#CDD4DE;
  --fg:#0F1B2D; --fg-2:#4F5B6E; --fg-3:#858FA0;
  --brand:#1C3769; --brand-soft:#E7ECF5; --brand-ink:#12264C;
  --brass:#9C7A35; --brass-soft:#F5EEDF;
  --ok:#2F7D5B; --ok-soft:#E4F1EA; --warn:#A86A12; --warn-soft:#FBF0DC; --bad:#B23A3A; --bad-soft:#F9E8E8;
  --forte:#1C3769; --medio:#5E7AAE; --fraco:#B5C3DC; --aud:#6A4E9A; --aud-soft:#EFEAF7;
  --shadow-1:0 1px 0 rgba(13,20,32,.04),0 1px 2px rgba(13,20,32,.04);
  --shadow-2:0 1px 0 rgba(13,20,32,.04),0 12px 32px -16px rgba(13,20,32,.22);
  --shadow-3:0 30px 80px -30px rgba(13,20,32,.45);
  --glass:rgba(245,246,248,.74); --scrim:rgba(8,12,18,.34);
  --ui:"Ubuntu",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --serif:"EB Garamond","Iowan Old Style","Georgia",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:24px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.32,1.28,.54,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F16; --surface:#121824; --surface-2:#18202E; --surface-3:#212B3B; --line:#222C3B; --line-2:#2E3A4D;
  --fg:#ECEFF4; --fg-2:#A3ADBC; --fg-3:#6E788A;
  --brand:#8FA9E0; --brand-soft:#18243D; --brand-ink:#B7C9F0;
  --brass:#D2AE63; --brass-soft:#2C2412;
  --ok:#5CC495; --ok-soft:#10291F; --warn:#E3A748; --warn-soft:#2F2310; --bad:#F07474; --bad-soft:#341616;
  --forte:#8FA9E0; --medio:#4E6596; --fraco:#2A3A5C; --aud:#B29BE6; --aud-soft:#231C36;
  --shadow-1:0 1px 0 rgba(255,255,255,.03);
  --shadow-2:0 1px 0 rgba(255,255,255,.03),0 16px 36px -18px rgba(0,0,0,.8);
  --shadow-3:0 30px 80px -30px rgba(0,0,0,.9);
  --glass:rgba(10,13,18,.74); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F16; --surface:#121824; --surface-2:#18202E; --surface-3:#212B3B; --line:#222C3B; --line-2:#2E3A4D;
  --fg:#ECEFF4; --fg-2:#A3ADBC; --fg-3:#6E788A;
  --brand:#8FA9E0; --brand-soft:#18243D; --brand-ink:#B7C9F0;
  --brass:#D2AE63; --brass-soft:#2C2412;
  --ok:#5CC495; --ok-soft:#10291F; --warn:#E3A748; --warn-soft:#2F2310; --bad:#F07474; --bad-soft:#341616;
  --forte:#8FA9E0; --medio:#4E6596; --fraco:#2A3A5C; --aud:#B29BE6; --aud-soft:#231C36;
  --shadow-1:0 1px 0 rgba(255,255,255,.03);
  --shadow-2:0 1px 0 rgba(255,255,255,.03),0 16px 36px -18px rgba(0,0,0,.8);
  --shadow-3:0 30px 80px -30px rgba(0,0,0,.9);
  --glass:rgba(10,13,18,.74); --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.015em}
.serif{font-family:var(--serif)}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-3);font-weight:500}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.seal{width:32px;height:32px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--brass-soft);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--brass)}
.brand b{font-size:15px;letter-spacing:-.01em} .brand span{display:block;font-size:11px;color:var(--fg-3)}
.ng{display:flex;flex-direction:column;gap:2px}
.ng small{padding:0 10px 6px}
td .mono,.cell2.num{white-space:nowrap}
.nv{text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--fg-2);position:relative;transition:color .2s,background .2s}
.nv svg{width:17px;height:17px;flex:none}
.nv:hover{background:var(--surface-2);color:var(--fg)}
.nv.on{color:var(--fg);background:var(--surface);box-shadow:var(--shadow-2);font-weight:500}
.nv.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brass);animation:navIn .45s var(--ease) both}
@keyframes navIn{from{transform:scaleY(0)}}
.nv .ct{margin-left:auto;font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nv .ct.hot{background:var(--brand);color:var(--surface);border-radius:999px;padding:1px 7px}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--fg-2)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.crumb{font-size:13px;color:var(--fg-3)} .crumb b{color:var(--fg);font-weight:500}
.sp{flex:1}
.kbar{display:flex;align-items:center;gap:8px;width:min(340px,40vw);padding:7px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--fg-3);font-size:13px;transition:border-color .2s}
.kbar:hover{border-color:var(--line-2)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--fg-3)}
.kbar kbd{margin-left:auto}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2);position:relative;transition:background .2s}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.ib svg{width:17px;height:17px}
.jobdot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 0 var(--brand);animation:ping 1.8s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.page{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:28px 80px;max-width:1320px;width:100%;margin:0 auto}
.view{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:.001;transform:translateY(8px)}}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-family:var(--serif);font-weight:500;font-size:40px;letter-spacing:-.015em;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--fg-2);max-width:62ch}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;font-weight:500;font-size:13.5px;white-space:nowrap;transition:transform .3s var(--spring),background .2s,box-shadow .2s,opacity .2s}
.btn svg{width:15px;height:15px}
.btn:active{transform:scale(.965)}
.btn.p{background:var(--brand);color:var(--surface);box-shadow:0 8px 20px -10px var(--brand)}
.btn.p:hover{background:var(--brand-ink)}
.btn.s{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.btn.s:hover{border-color:var(--line-2)}
.btn.g{color:var(--fg-2)} .btn.g:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.br{background:var(--brand-soft);color:var(--brand)}
.chip.aud{background:var(--aud-soft);color:var(--aud)}
.force{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2)}
.force .bars{display:inline-flex;gap:2px;align-items:flex-end}
.force .bars b{width:4px;border-radius:2px;background:var(--surface-3)}
.force .bars b:nth-child(1){height:6px}.force .bars b:nth-child(2){height:9px}.force .bars b:nth-child(3){height:12px}
.force.f3 .bars b{background:var(--forte)} .force.f2 .bars b:nth-child(-n+2){background:var(--forte)} .force.f1 .bars b:nth-child(1){background:var(--forte)}

/* segmented tabs */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface-2);position:relative}
.seg button{position:relative;z-index:1;height:32px;padding:0 14px;border-radius:9px;font-weight:500;font-size:13px;color:var(--fg-2);display:inline-flex;align-items:center;gap:8px;transition:color .25s}
.seg button.on{color:var(--fg)}
.seg button .n{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--surface);box-shadow:var(--shadow-2);transition:transform .5s var(--spring),width .5s var(--spring)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.mt{background:var(--surface);border-radius:var(--r-l);padding:16px 18px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:4px;min-width:0;animation:rise .55s var(--ease) both}
.mt:nth-child(2){animation-delay:40ms}.mt:nth-child(3){animation-delay:80ms}.mt:nth-child(4){animation-delay:120ms}
@keyframes rise{from{opacity:.001;transform:translateY(10px) scale(.985)}}
.mt .l{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.mt .v{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.mt .d{font-size:11.5px;color:var(--fg-3)}
.mt .meter{height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.mt .meter b{display:block;height:100%;background:var(--brand);border-radius:3px;transform-origin:left;transition:transform .9s var(--ease)}

/* toolbar + table */
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;max-width:360px;height:34px;padding:0 10px;border-radius:10px;background:var(--surface-2);color:var(--fg-3)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px}
.sel{height:34px;padding:0 30px 0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.pills{display:inline-flex;gap:4px}
.pf{height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;color:var(--fg-2);border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.pf:hover{background:var(--surface-2)}
.pf.on{background:var(--fg);color:var(--bg)}
.pf .n{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow-2);overflow:hidden}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{position:sticky;top:0;text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
tbody tr.sel-row{background:var(--brand-soft)}
tbody tr.enter{animation:rowIn .5s var(--ease) both}
@keyframes rowIn{from{opacity:.001;transform:translateY(6px)}}
tbody tr.leaving{animation:rowOut .38s var(--ease) forwards}
@keyframes rowOut{to{opacity:0;transform:translateX(24px)}}
.cell2{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell2 small{font-size:11.5px;color:var(--fg-3)}
.cnjb{display:inline-flex;align-items:center;gap:6px}
.copy{opacity:0;color:var(--fg-3);transition:opacity .2s}
tr:hover .copy{opacity:1}
.ra{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.ab{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--fg-3);border:1px solid var(--line);background:var(--surface);transition:all .25s var(--spring)}
.ab svg{width:14px;height:14px}
.ab:active{transform:scale(.88)}
.ab.ok:hover{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.ab.no:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.cb{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:all .2s}
.cb.on{background:var(--brand);border-color:var(--brand)}
.cb.on::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.bulk{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:15;background:var(--fg);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-3);transition:transform .55s var(--spring)}
.bulk.on{transform:translate(-50%,0)}
.bulk .btn{height:32px}
.bulk .btn.s{background:transparent;border-color:color-mix(in srgb,var(--bg) 25%,transparent);color:var(--bg);box-shadow:none}
.empty{padding:56px 20px;text-align:center;color:var(--fg-3)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px;font-weight:500}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:21;background:var(--surface);box-shadow:var(--shadow-3);transform:translateX(105%);transition:transform .6s var(--spring);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.shh{padding:22px 24px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative}
.shh .x{position:absolute;top:16px;right:16px}
.shh h3{margin:0;font-family:var(--mono);font-weight:500;font-size:17px;letter-spacing:-.02em}
.shb{padding:20px 24px 40px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r-m);overflow:hidden}
.kv div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kv span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.kv b{font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.tl{position:relative;display:flex;flex-direction:column;gap:16px;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line);transform-origin:top;animation:draw .9s var(--ease) both}
@keyframes draw{from{transform:scaleY(0)}}
.tli{position:relative;animation:rowIn .5s var(--ease) both}
.tli::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--fg-3));box-shadow:0 0 0 3px var(--surface)}
.tli .t{font-weight:500;font-size:13.5px}
.tli .m{font-size:12px;color:var(--fg-3)}
.ex{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--fg-2);font-family:var(--serif);font-size:14px;line-height:1.5}
.ex mark{background:var(--brand-soft);color:var(--brand);padding:0 3px;border-radius:4px}
.blk{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px}
.blk h4{margin:0;font-size:13px;font-weight:500}
.note{font-size:11.5px;color:var(--fg-3)}

/* forms */
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.fcard{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow-2);padding:22px;display:flex;flex-direction:column;gap:16px}
.fcard h3{margin:0;font-size:16px;font-weight:500;letter-spacing:-.01em}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;color:var(--fg-2);font-weight:500}
.inp{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);transition:border-color .2s,box-shadow .2s;width:100%}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.inp.mono{font-size:14px}
.inp.valid{border-color:var(--ok)} .inp.invalid{border-color:var(--bad)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.hint{font-size:11.5px;color:var(--fg-3);display:flex;align-items:center;gap:6px;min-height:16px}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optb{padding:12px;border-radius:12px;border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;transition:all .25s var(--ease)}

/* monitoramento */

.prog{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}

/* modal, toast, palette */

@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.95)}}

.pal{position:fixed;inset:0;z-index:35;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;opacity:0;pointer-events:none;transition:opacity .25s}

/* ---- v2: motion extras ---- */

/* ===== Toga v4 · Verde-nanquim: uma cor, uma família tipográfica, profundidade discreta ===== */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EBEEEA; --surface-3:#DFE4DE; --line:#E0E4DE; --line-2:#CBD2CA;
  --fg:#101411; --fg-2:#4D5750; --fg-3:#7F8982;
  --brand:#14483A; --brand-soft:#E2ECE7; --brand-ink:#0D3329;
  --brass:#14483A; --brass-soft:#E2ECE7;
  --ok:#14483A; --ok-soft:#E2ECE7; --warn:#8A6417; --warn-soft:#F6EFDD; --bad:#9A3A30; --bad-soft:#F7E9E6;
  --forte:#14483A; --medio:#6E9485; --fraco:#BFD0C8; --aud:#465868; --aud-soft:#E8ECF0;
  --side-bg:#0E2A22; --side-fg:#E6EEEA; --side-fg-2:#9DB3AA; --side-line:#1C3D33; --side-on:#17382E;

body{font-size:14.5px;letter-spacing:-.003em}
.mono{font-size:12.5px;letter-spacing:0}
.eyebrow{font-family:var(--ui);font-size:12px;letter-spacing:.01em;text-transform:none;font-weight:500;color:var(--fg-3)}

/* títulos: mesma família, peso médio, tracking fechado; revelação por máscara */
.ph{border-bottom:0;padding-bottom:0;margin-bottom:26px}
.ph h1{font-family:var(--ui);font-weight:500;font-size:40px;letter-spacing:-.035em;line-height:1.08;animation:none;overflow:hidden;padding-bottom:.08em}
.ph h1 .ln{display:inline-block;animation:lineUp .9s var(--ease) both}

@keyframes fadeUp{from{opacity:.001;transform:translateY(8px)}}
.sh2 h2,.ds-sec h2,.mc h3{font-family:var(--ui);font-weight:500;letter-spacing:-.025em}
.serif{font-family:var(--ui);letter-spacing:-.025em;font-weight:500}

/* barra lateral: capa verde-nanquim */
.side{background:var(--side-bg);border-right:0;color:var(--side-fg);padding:20px 14px}
.side .brand b{color:var(--side-fg)} .side .brand span{color:var(--side-fg-2)}
.side .eyebrow{color:var(--side-fg-2);opacity:.75}
.seal{border-radius:10px;background:var(--side-fg);color:var(--side-bg);box-shadow:none}
.side .nv{color:var(--side-fg-2);border-radius:var(--r-m);transition:color .3s var(--ease),background .3s var(--ease)}
.side .nv:hover{background:var(--side-on);color:var(--side-fg)}
.side .nv.on{background:var(--side-on);color:var(--side-fg);box-shadow:inset 0 0 0 1px var(--side-line)}
.side .nv.on::before{left:-14px;top:10px;bottom:10px;width:3px;background:var(--side-fg);border-radius:0 2px 2px 0}
.side .nv .ct{color:var(--side-fg-2)}
.side .nv .ct.hot{background:var(--side-fg);color:var(--side-bg);border:0;border-radius:999px;font-weight:600}
.side .user{border-color:var(--side-line);border-radius:var(--r-l)}
.side .user .faint{color:var(--side-fg-2)}
.side .av{background:var(--side-on);color:var(--side-fg)}

/* topo */
.top{backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom-color:transparent;transition:border-color .3s}

.btn.p:hover{background:var(--brand-ink);transform:translateY(-1px)}
.btn.s{border-color:var(--line-2);box-shadow:var(--shadow-1);background:var(--surface)}
.btn.s:hover{border-color:var(--fg-3);background:var(--surface)}

.ab{border-radius:999px;transition:all .35s var(--ease)}

/* chips: pílulas calmas */
.chip{height:22px;border-radius:999px;border:0;background:var(--surface-2);color:var(--fg-2);font-weight:500;font-size:11.5px}
.chip.ok{background:var(--brand-soft);color:var(--brand);border:0}
.chip.warn{background:var(--warn-soft);color:var(--warn);border:0}
.chip.bad{background:var(--bad-soft);color:var(--bad);border:0}

td{padding:15px 16px}
tbody tr{position:relative;transition:background .35s var(--ease)}

@keyframes rowIn{from{opacity:.001;transform:translateY(10px)}}

.pf.on{background:var(--fg);color:var(--bg);border-color:transparent}
.cb{border-radius:6px}
.force.f3 .bars b,.force.f2 .bars b:nth-child(-n+2),.force.f1 .bars b:nth-child(1){background:var(--brand)}
.bulk{border-radius:999px;padding:8px 8px 8px 20px}
.foot{padding:12px 16px}

.sheet{transition:transform .75s var(--ease);border-radius:var(--r-xl) 0 0 var(--r-xl);overflow:hidden}

/* ---- seletor de serviço ---- */
.view{--svc:var(--slate);--svc-soft:var(--surface-2)}

.view[data-svc="aud"]{--svc:var(--aud);--svc-soft:var(--aud-soft)}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:0}
.sv{--c:var(--slate);--cs:var(--surface-2);position:relative;text-align:left;padding:16px 18px 18px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow-2);display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 14px;align-items:center;transition:transform .6s var(--ease),background .5s var(--ease),color .5s var(--ease),box-shadow .5s var(--ease)}
.sv[data-k="cit"]{--c:var(--brand);--cs:var(--brand-soft)} .sv[data-k="aud"]{--c:var(--aud);--cs:var(--aud-soft)}
.sv .si{grid-row:span 2;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--cs);color:var(--c);transition:background .5s var(--ease),color .5s var(--ease),transform .6s var(--ease)}

.rs>h4 small{font-weight:400;font-size:12.5px;color:var(--fg-3)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line-2)}
.md{position:relative;text-align:left;padding:14px 14px 16px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;transition:background .3s var(--ease)}
.md:first-child{border-left:0}
.md:hover{background:var(--surface-2)}
.md b{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.md .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:border-color .25s}
.md .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);transform:scale(0);transition:transform .35s var(--ease)}
.md p{margin:0;font-size:12.5px;color:var(--fg-2);min-height:3.2em}
.md.on{background:var(--brand-soft);box-shadow:inset 0 2px 0 var(--brand)}
.md.on .rd{border-color:var(--brand)} .md.on .rd::after{transform:none}
.tlx{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:4px}
.tlx i{height:6px;background:var(--surface-3);transform-origin:left;transition:background .4s var(--ease)}
.tlx i.f{background:var(--brand)}
.tlx span{font-size:10.5px;color:var(--fg-3)} .tlx span:last-child{text-align:right}
.mnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--fg-2);font-size:12.5px;animation:rowIn .4s var(--ease) both}
.mnote b{color:var(--warn);font-weight:500}
.mnote button{color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-2)}
.op{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;text-align:left;padding:12px 14px;border-top:1px solid var(--line);border-left:1px solid var(--line);transition:background .25s var(--ease)}
.op:nth-child(-n+2){border-top:0} .op:nth-child(odd){border-left:0}
.op:hover{background:var(--surface-2)}
.op .cb{margin-top:2px;pointer-events:none}
.op b{font-weight:500;display:block} .op small{color:var(--fg-3);font-size:12px}
.op.on{background:var(--brand-soft)}
.op[aria-disabled="true"]{cursor:default} .op[aria-disabled="true"] .cb{opacity:.6}
.op .lock{font-size:11px;color:var(--brand);font-weight:500}
.shf{border-top:1px solid var(--line-2);padding:14px 24px;display:flex;gap:14px;align-items:center;background:var(--surface)}
.shf .sm2{flex:1;font-size:13px;color:var(--fg-2);min-width:0}
.shf .sm2 b{color:var(--fg);font-weight:500}
.regcta{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:34px 20px;border:1px dashed var(--line-2);transition:background .3s,border-color .3s}
.regcta.over{border-color:var(--brand);background:var(--brand-soft)}
@media (max-width:640px){.modes,.opts{grid-template-columns:1fr}.md{border-left:0;border-top:1px solid var(--line-2)}.md:first-child{border-top:0}.md p{min-height:0}.op{border-left:0!important;border-top:1px solid var(--line)!important}.op:first-child{border-top:0!important}.shf{flex-direction:column;align-items:stretch}}

<script>
/* ---------- util ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=n=>`<svg><use href="#i-${n}"/></svg>`;
const fmt=n=>n.toLocaleString('pt-BR');
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const pick=a=>a[Math.floor(rnd()*a.length)];
function cnjDV(n,a,j,tr,o){const v=BigInt(n+a+j+tr+o+'00');return String(98n-(v%97n)).padStart(2,'0')}
function mkCNJ(a,j,tr){const n=String(Math.floor(rnd()*9999999)).padStart(7,'0'),o=String(Math.floor(rnd()*9999)).padStart(4,'0');return `${n}-${cnjDV(n,a,j,tr,o)}.${a}.${j}.${tr}.${o}`}
function cnjCheck(s){const m=s.replace(/\D/g,'');if(m.length!==20)return{ok:false,msg:'O CNJ tem 20 dígitos. Faltam '+(20-m.length)+'.'};
  const n=m.slice(0,7),dv=m.slice(7,9),a=m.slice(9,13),j=m.slice(13,14),tr=m.slice(14,16),o=m.slice(16);
  if(cnjDV(n,a,j,tr,o)!==dv)return{ok:false,msg:'Dígito verificador não confere. Revise o número.'};
  const just={'1':'STF','2':'CNJ','3':'STJ','4':'Justiça Federal','5':'Justiça do Trabalho','6':'Justiça Eleitoral','7':'Justiça Militar da União','8':'Justiça Estadual','9':'Justiça Militar Estadual'}[j];
  return{ok:true,msg:`${just} · ${trib(j,tr)} · ${a}`,fmt:`${n}-${dv}.${a}.${j}.${tr}.${o}`}}
const TRS={'8.26':'TJSP','8.19':'TJRJ','8.13':'TJMG','8.21':'TJRS','8.05':'TJBA','8.16':'TJPR','8.24':'TJSC','8.25':'TJSE','5.02':'TRT-2','5.03':'TRT-3','4.03':'TRF-3'};
const trib=(j,tr)=>TRS[j+'.'+tr]||('Tribunal '+j+'.'+tr);
const CL=['Carteira Aurora','Carteira Boreal','Carteira Cobalto','Carteira Delta','Carteira Estrela','Carteira Farol'];
const today=new Date(2026,10,6);
const dfmt=d=>d?d.toLocaleDateString('pt-BR'):null;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

/* ---------- dados de exemplo ---------- */
const CIT_T=[
 {f:3,t:'Citação eletrônica confirmada',q:'<mark>Citação eletrônica confirmada</mark> pelo destinatário em portal.',r:'Regra 2 · peso 100'},
 {f:3,t:'Mandado de citação cumprido',q:'<mark>Mandado devolvido cumprido</mark>. Réu citado pessoalmente.',r:'Regra 3 · peso 90'},
 {f:3,t:'Prazo de citação iniciado',q:'<mark>Iniciado prazo - citação</mark> eletrônica.',r:'Regra 5 · peso 80'},
 {f:2,t:'Mandado de citação expedido',q:'Expedido <mark>mandado de citação</mark> ao endereço do réu.',r:'Regra 9 · peso 55'},
 {f:2,t:'Edital de citação disponibilizado',q:'Disponibilizado <mark>edital</mark> de citação com prazo de 20 dias.',r:'Regra 8 · peso 55'},
 {f:2,t:'Carta de citação expedida',q:'Expedida <mark>carta de citação</mark> com aviso de recebimento.',r:'Regra 10 · peso 50'},
 {f:1,t:'Citação determinada',q:'<mark>Cite-se</mark> a parte requerida para responder.',r:'Regra 14 · peso 30'},
 {f:1,t:'Menção a citação',q:'Aguardando <mark>citação</mark> do requerido.',r:'Regra 17 · peso 10'}];
const AUD_T=['Audiência de conciliação (art. 334 CPC)','Audiência de instrução e julgamento','Audiência una','Audiência de conciliação'];
const LOC=['1ª Vara Cível','2ª Vara Cível','Juizado Especial Cível','Vara Única','Telepresencial · Teams','3ª Vara do Trabalho'];
const trList=[['2026','8','26'],['2026','8','26'],['2026','8','19'],['2026','8','13'],['2026','8','21'],['2026','8','05'],['2026','8','16'],['2026','5','02'],['2025','8','24']];
const IND=[];let uid=1;
for(let i=0;i<34;i++){const [a,j,tr]=pick(trList),cnj=mkCNJ(a,j,tr),T=CIT_T[Math.min(7,Math.floor(rnd()*rnd()*9+rnd()*2))];
  const lag=rnd()<.22?Math.floor(8+rnd()*25):Math.floor(rnd()*3);const cons=addD(today,-(rnd()<.8?0:1));
  IND.push({id:uid++,tipo:'cit',cnj,tr:trib(j,tr),cl:pick(CL),polo:rnd()<.9?'Passivo':'Ativo',f:T.f,t:T.t,q:T.q,rule:T.r,ato:rnd()<.06?null:addD(cons,-lag),cons,late:lag>7,status:'pend',evs:1})}

  <nav class="toc" aria-label="Seções"><a href="#ds-princ" data-sc>Princípios</a><a href="#ds-cor" data-sc>Cor</a><a href="#ds-tipo" data-sc>Tipografia</a><a href="#ds-esp" data-sc>Espaço e elevação</a><a href="#ds-comp" data-sc>Componentes</a><a href="#ds-mov" data-sc>Movimento</a><a href="#ds-uso" data-sc>Faça e evite</a><a href="#ds-voc" data-sc>Vocabulário</a><a href="#ds-a11y" data-sc>Acessibilidade</a></nav>

  <div class="ds-sec" id="ds-princ"><h2>Princípios</h2><p>Quando duas regras entram em conflito, vale a de cima.</p>
   <div class="princ" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    <div class="pc"><span class="eyebrow">I</span><b>Nada some sem decisão</b><p>Filtros organizam, nunca escondem. Todo indicativo do lote fica visível até alguém decidir sobre ele.</p></div>
    <div class="pc"><span class="eyebrow">II</span><b>Datas são protagonistas</b><p>Data do ato e de consumo andam juntas, sempre rotuladas. Data ausente aparece escrita, nunca como traço.</p></div>
    <div class="pc"><span class="eyebrow">III</span><b>Linguagem que não promete</b><p>"Indicativo", não "citado". A tela descreve o que o robô encontrou, sem afirmar o estado jurídico.</p></div>
    <div class="pc"><span class="eyebrow">IV</span><b>Silêncio operacional</b><p>Cor só para estado. Movimento só quando algo mudou. O resto é papel em branco para o dado aparecer.</p></div></div></div>

  <div class="ds-sec" id="ds-cor"><h2>Cor</h2><p>A paleta vem do site da Jurify. O azul é a cor da marca: capa lateral, navegação, força da evidência e o serviço de Citações. O verde é a cor de ação e de conclusão: botão principal, validado, importado. Audiências usam um verde-azulado próprio para não se confundir com "validado". Âmbar e vermelho ficam para atenção e erro, sempre com texto.</p>
   <div class="sw-grid">${sw('Papel','--bg','fundo da aplicação')+sw('Folha','--surface','cartões e tabelas')+sw('Tinta','--fg','texto principal')+sw('Azul Jurify','--brand','marca, citações, foco')+sw('Verde Jurify','--cta','ação principal, conclusão')+sw('Capa','--side-bg','lateral, capa dos autos')+sw('Forte','--forte','evidência forte')+sw('Médio','--medio','evidência média')+sw('Fraco','--fraco','evidência fraca')+sw('Audiência','--aud','contexto de pauta')+sw('Atenção','--warn','chegou tarde, instável')+sw('Indeferido','--bad','descarte, erro')}</div></div>

  <div class="ds-sec" id="ds-tipo"><h2>Tipografia</h2><p>Ubuntu, a fonte do site da Jurify, conduz tudo: negrito nos títulos e métricas, regular no texto. Ubuntu Mono alinha os 20 dígitos do CNJ, que são conferidos um a um. Ênfase se faz com itálico ou peso da mesma família.</p>
   <div class="ts">
    <div><code>Display · 40/500, -3,5%</code><span class="serif" style="font-size:40px;letter-spacing:-.015em;line-height:1.05">Central de Indicativos</span></div>
    <div><code>Título · 24/500</code><span class="serif" style="font-size:24px">Importações recentes</span></div>
    <div><code>Ênfase · itálico 22</code><span style="font-size:22px;font-style:italic;letter-spacing:-.02em">Cite-se a parte requerida.</span></div>
    <div><code>Métrica · 44/500, -4,5%</code><span style="font-size:44px;font-weight:500;letter-spacing:-.045em;line-height:1" class="num">1.198</span></div>
    <div><code>Corpo · 14,5/400</code><span>Expedido mandado de citação ao endereço do réu, com prazo de 15 dias para contestação.</span></div>
    <div><code>Rótulo · 12/500</code><span class="eyebrow">Data de consumo</span></div>
    <div><code>Processo · Ubuntu Mono 14</code><span class="mono" style="font-size:15px">1011710-41.2026.8.13.0231</span></div></div></div>

  <div class="ds-sec" id="ds-esp"><h2>Espaço e elevação</h2><p>Grade de 4 pontos. Tabelas densas usam 12 e 14; seções respiram em 32 e 48. Sem sombras: os painéis são separados por fios de 1px, e só diálogos e painéis laterais projetam sombra. Cantos retos de 2 a 3px em tudo.</p>
   <div class="spc">${[4,8,12,16,24,32,48,64].map(n=>`<div><b style="width:${n}px;height:${n}px"></b>${n}</div>`).join('')}</div>
   <div class="elev" style="margin-top:12px"><div style="box-shadow:var(--shadow-1);border:1px solid var(--line)"><b style="font-weight:500">Nível 1 · Assentado</b><span class="faint">linhas, campos</span></div><div style="box-shadow:var(--shadow-2)"><b style="font-weight:500">Nível 2 · Folha</b><span class="faint">cartões, tabelas</span></div><div style="box-shadow:var(--shadow-3)"><b style="font-weight:500">Nível 3 · Sobreposto</b><span class="faint">painéis, diálogos</span></div></div></div>

  <div class="ds-sec" id="ds-comp"><h2>Componentes</h2><p>Botões dizem o que fazem. Chips dizem um estado. Nunca o contrário.</p>
   <div class="cmp">
    <div class="pc"><b>Botões</b><div class="demo"><button class="btn p">${ic('ok')}Validar indicativo</button><button class="btn s">${ic('up')}Importar planilha</button><button class="btn g">Desfazer</button></div><p>Um primário por área. Verbo no infinitivo com o objeto: "Validar indicativo", nunca "OK".</p></div>
    <div class="pc"><b>Estados</b><div class="demo"><span class="chip br"><i></i>Pendente</span><span class="chip ok"><i></i>Validado</span><span class="chip bad"><i></i>Descartado</span><span class="chip warn">Chegou tarde</span><span class="chip aud">Audiência 18/11</span></div><p>Com ponto: estado da decisão. Sem ponto: contexto do processo.</p></div>
    <div class="pc"><b>Força da evidência</b><div class="demo"><span class="force f3"><span class="bars"><b></b><b></b><b></b></span>Forte</span><span class="force f2"><span class="bars"><b></b><b></b><b></b></span>Médio</span><span class="force f1"><span class="bars"><b></b><b></b><b></b></span>Fraco</span></div><p>Intensidade, não alarme. Sempre acompanhada da regra que disparou.</p></div>
    <div class="pc"><b>Abas que adaptam</b><div class="demo">${seg('dsSeg',[['a','Consolidado'],['b','Citações'],['c','Audiências']],'a')}</div><p>A pílula desliza; métricas e colunas se reorganizam para o fluxo escolhido.</p></div>
    <div class="pc"><b>Etapas de importação</b><div class="demo" style="overflow-x:auto"><ol class="stp" style="min-width:420px"><li class="done"><span class="sd">${ic('ok')}</span><span>Arquivo</span></li><li class="sl"><b style="transform:scaleX(1)"></b></li><li class="on"><span class="sd">2</span><span>Colunas</span></li><li class="sl"><b></b></li><li><span class="sd">3</span><span>Conferência</span></li></ol></div><p>O fio entre etapas se preenche ao avançar. Sempre dá para voltar.</p></div>
    <div class="pc"><b>Marca de conclusão</b><div class="demo"><div class="pring" style="width:96px;height:96px"><div class="stamp" id="dsStamp"><span>Triado</span><small>06/11</small></div></div><button class="btn g sm" id="reStamp">Carimbar de novo</button></div><p>Reservado para fechamentos de verdade: lote triado, importação concluída.</p></div>
   </div></div>

  <div class="ds-sec" id="ds-mov"><h2>Movimento</h2><p>Uma única curva de desaceleração, sem quique. O que muda é a duração: quanto maior o elemento, mais longa a chegada. Saída é sempre mais rápida. Tudo respeita a preferência de movimento reduzido. Toque numa faixa para ver.</p>
   <div class="mtk">${MT.map(([n,d,e,u])=>`<div><b style="font-weight:500">${n}</b><code>${d}</code><code>${e}</code><div class="lane" style="--d:${parseInt(d)/1000*(n==='Contínuo'?1:1.6)}s;--e:${e}" title="${u}" role="button" tabindex="0" aria-label="Demonstrar ${n}"><i></i></div></div>`).join('')}</div>
   <div class="note" style="margin-top:8px">Uso: ${MT.map(m=>`<b style="font-weight:500">${m[0]}</b> ${m[3].toLowerCase()}`).join(' · ')}.</div></div>

  <div class="ds-sec" id="ds-uso"><h2>Faça e evite</h2><p>Regras práticas que mantêm a tela sem ambiguidade para quem tria em volume.</p>
   <div class="dont">
    <div class="pc"><span class="tag y">Faça</span><b>Um primário por tela</b><p>Na Central, "Exportar lote". No Cadastro, "Importar planilha". O resto é secundário ou texto.</p></div>
    <div class="pc"><span class="tag n">Evite</span><b>Ação destrutiva sem saída</b><p>Descartar em massa pede confirmação a partir de 4 itens e sempre oferece Desfazer.</p></div>
    <div class="pc"><span class="tag y">Faça</span><b>Explique a coluna onde ela está</b><p>Cabeçalhos com sublinhado pontilhado mostram o significado ao passar o mouse.</p></div>
    <div class="pc"><span class="tag n">Evite</span><b>Cor como única pista</b><p>Todo estado tem palavra: "Validado", "Chegou tarde", "Falha na consulta".</p></div>
    <div class="pc"><span class="tag y">Faça</span><b>Diga o próximo passo</b><p>A faixa de orientação no topo resume o que falta e o que fazer primeiro.</p></div>
    <div class="pc"><span class="tag n">Evite</span><b>Erro sem conserto</b><p>"Dígito verificador não confere. Revise o número." em vez de "CNJ inválido".</p></div>
   </div></div>
  <div class="ds-sec" id="ds-voc"><h2>Vocabulário</h2><p>As palavras fazem parte do sistema. Elas impedem a tela de prometer o que o dado não sustenta.</p>
   <div class="lex">
    <div><span class="yes">Indicativo de citação</span><span class="faint">o robô encontrou um sinal no andamento</span></div><div><span class="no">Réu citado</span><span class="faint">afirma estado jurídico não verificado</span></div>
    <div><span class="yes">Validado pela equipe</span><span class="faint">decisão humana sobre o sinal</span></div><div><span class="no">Prazo garantido</span><span class="faint">o agendamento acontece fora da plataforma</span></div>
    <div><span class="yes">Sem data na fonte</span><span class="faint">o tribunal não informou</span></div><div><span class="no">Campo em branco</span><span class="faint">o vazio se perde na planilha</span></div>
    <div><span class="yes">Chegou tarde</span><span class="faint">ato antigo que entrou neste lote</span></div><div><span class="no">Atrasado</span><span class="faint">sugere culpa de quem trata</span></div></div></div>

  <div class="ds-sec" id="ds-a11y"><h2>Acessibilidade</h2><p>Quem tria o lote passa o dia na tela. Conforto visual é requisito, não acabamento.</p>
   <div class="a11y"><div class="pc"><span class="v">4,5:1</span><p>Contraste mínimo de texto nos dois temas.</p></div><div class="pc"><span class="v">V · D · J · K</span><p>Triagem inteira pelo teclado, com foco sempre visível.</p></div><div class="pc"><span class="v">5 s</span><p>Para desfazer qualquer decisão em massa ou exclusão.</p></div><div class="pc"><span class="v">Cor + texto</span><p>Nenhum estado depende só da cor.</p></div></div></div>
  </section>`;
  requestAnimationFrame(()=>placePill('dsSeg'));$$('#dsSeg button').forEach(b=>b.onclick=()=>{$$('#dsSeg button').forEach(x=>x.classList.toggle('on',x===b));placePill('dsSeg')});
  $$('.mtk .lane').forEach(l=>{const go=()=>{l.classList.remove('go');l.style.setProperty('--w',l.offsetWidth+'px');void l.offsetWidth;l.classList.add('go')};l.onclick=go;l.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  setTimeout(()=>$$('.mtk .lane').forEach((l,i)=>setTimeout(()=>l.click(),i*120)),500);
  $('#reStamp').onclick=()=>{const s=$('#dsStamp');s.style.animation='none';void s.offsetWidth;s.style.animation=''};
  $$('[data-sc]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});
  guilloche()}
function guilloche(){const c=$('#guil');if(!c)return;const x=c.getContext('2d'),W=840,cx=W/2;let t=0,raf;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const draw=()=>{x.clearRect(0,0,W,W);x.lineWidth=1;const col=getComputedStyle(document.documentElement).getPropertyValue('--side-fg-2').trim()||'#9DB3AA';x.strokeStyle=col;
   for(let k=0;k<14;k++){x.beginPath();const R=120+k*16,r=38+k*2.2,d=46;for(let a=0;a<=Math.PI*2+.01;a+=.02){const ph=a+t*(k%2?1:-1)*.15;const X=cx+(R-r)*Math.cos(ph)+d*Math.cos((R-r)/r*ph),Y=cx+(R-r)*Math.sin(ph)-d*Math.sin((R-r)/r*ph);a?x.lineTo(X,Y):x.moveTo(X,Y)}x.globalAlpha=.25+.04*k;x.stroke()}
   x.globalAlpha=1;t+=.004;if(!reduce&&document.body.contains(c))raf=requestAnimationFrame(draw)};draw()}
